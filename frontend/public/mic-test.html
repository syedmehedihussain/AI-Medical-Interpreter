<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Medical Interpreter microphone diagnostic</title>
    <style>
      body { font: 15px/1.6 system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; }
      h1 { font-size: 1.25rem; }
      button { font: inherit; padding: .7rem 1.2rem; border-radius: .5rem; border: 0; background: #0369a1; color: #fff; cursor: pointer; }
      button.stop { background: #1e293b; }
      #log { background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: .5rem; font: 12px/1.6 ui-monospace, monospace; white-space: pre-wrap; min-height: 12rem; margin-top: 1rem; }
      .row { display: flex; gap: .5rem; align-items: center; margin: 1rem 0; }
      table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
      td { border-bottom: 1px solid #e2e8f0; padding: .4rem .5rem; vertical-align: top; }
      td:first-child { color: #64748b; width: 14rem; }
      .ok { color: #15803d; font-weight: 600; }
      .bad { color: #b91c1c; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>AI Medical Interpreter microphone diagnostic</h1>
    <p>
      This page talks to the browser speech API directly, with none of the app's
      React code involved. If speech fails here too, the problem is the browser
      or the microphone. If it works here but not in the app, the bug is mine.
    </p>

    <table id="env"></table>

    <div class="row">
      <button id="start">Start listening</button>
      <button id="stop" class="stop">Stop</button>
      <button id="perm">Check mic permission</button>
    </div>

    <div id="log">waiting...</div>

    <script>
      const logEl = document.getElementById('log')
      let lines = []
      function log(msg) {
        const time = new Date().toLocaleTimeString()
        lines.push(`[${time}] ${msg}`)
        logEl.textContent = lines.slice(-40).join('\n')
      }

      const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition
      const rows = [
        ['SpeechRecognition present', !!window.SpeechRecognition],
        ['webkitSpeechRecognition present', !!window.webkitSpeechRecognition],
        ['isSecureContext', window.isSecureContext],
        ['speechSynthesis present', !!window.speechSynthesis],
        ['origin', location.origin],
        ['userAgent', navigator.userAgent],
      ]
      document.getElementById('env').innerHTML = rows
        .map(([k, v]) => {
          const val = typeof v === 'boolean'
            ? `<span class="${v ? 'ok' : 'bad'}">${v}</span>`
            : String(v)
          return `<tr><td>${k}</td><td>${val}</td></tr>`
        })
        .join('')

      // List Bangla voices, which answers the separate E-21 question.
      function listVoices() {
        const voices = speechSynthesis.getVoices()
        const bn = voices.filter((v) => v.lang.toLowerCase().startsWith('bn'))
        log(`voices loaded: ${voices.length} total, ${bn.length} Bangla`)
        bn.forEach((v) => log(`   Bangla voice: ${v.name} (${v.lang})`))
        if (!bn.length && voices.length) log('   no Bangla voice -> speaker button will be disabled (E-21)')
      }
      speechSynthesis.addEventListener('voiceschanged', listVoices)
      setTimeout(listVoices, 400)

      document.getElementById('perm').onclick = async () => {
        try {
          const status = await navigator.permissions.query({ name: 'microphone' })
          log(`permissions.query(microphone) = ${status.state}`)
        } catch (e) {
          log(`permissions.query failed: ${e.message}`)
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
          log(`getUserMedia OK -> ${stream.getAudioTracks().length} audio track(s)`)
          stream.getAudioTracks().forEach((t) => log(`   track: ${t.label || '(no label)'}`))
          stream.getTracks().forEach((t) => t.stop())
        } catch (e) {
          log(`getUserMedia FAILED: ${e.name} - ${e.message}`)
        }
      }

      let recognition = null

      document.getElementById('start').onclick = () => {
        if (!Ctor) { log('FATAL: no SpeechRecognition constructor in this browser'); return }
        recognition = new Ctor()
        recognition.continuous = true
        recognition.interimResults = true
        recognition.lang = 'en-US'

        recognition.onstart = () => log('onstart -- engine running, speak now')
        recognition.onaudiostart = () => log('onaudiostart -- microphone open')
        recognition.onsoundstart = () => log('onsoundstart -- sound detected')
        recognition.onspeechstart = () => log('onspeechstart -- speech detected')
        recognition.onspeechend = () => log('onspeechend')
        recognition.onaudioend = () => log('onaudioend')
        recognition.onnomatch = () => log('onnomatch')
        recognition.onerror = (e) =>
          log(`ONERROR -> error="${e.error}" message="${e.message || ''}"`)
        recognition.onend = () => log('onend -- engine stopped')
        recognition.onresult = (e) => {
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const r = e.results[i]
            log(`${r.isFinal ? 'FINAL' : 'interim'}: "${r[0].transcript}"`)
          }
        }

        try {
          recognition.start()
          log('start() called')
        } catch (e) {
          log(`start() threw: ${e.name} - ${e.message}`)
        }
      }

      document.getElementById('stop').onclick = () => {
        if (recognition) { recognition.stop(); log('stop() called') }
      }
    </script>
  </body>
</html>
